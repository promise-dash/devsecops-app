name: Application CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: devsecopslabacr.azurecr.io
  IMAGE_NAME: devsecops-app

jobs:
  validate-build-push:
    name: Validate, Build and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript syntax
        run: npm run check

      - name: Authenticate to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name devsecopslabacr

      - name: Build Docker image
        run: |
          docker build \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --tag "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: devsecopslabacr.azurecr.io/devsecops-app:${{ github.sha }}
          scan-type: image
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Push Docker image
        run: |
          docker push "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${REGISTRY}/${IMAGE_NAME}:latest"

      - name: Report image reference
        run: |
          echo "Image published successfully."
          echo "Image: ${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
