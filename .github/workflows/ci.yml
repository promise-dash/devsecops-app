name: Application CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate and Build
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript Syntax
        run: npm run check

      - name: Build Docker Image
        run: |
          docker build \
          --label org.opencontainers.image.revision="$IMAGE_TAG" \
          --tag "devsecops-sample-app:$IMAGE_TAG" \
          .
      - name: Report image reference
        run: |
          echo "Image build succeeded."
          echo "Commit SHA: $IMAGE_TAG"
          echo "Local CI image: devsecops-sample-app:$IMAGE_TAG"

